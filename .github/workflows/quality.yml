name: Code Quality

on:
  # Scoped to buildable code so this workflow does not run on docs/spec-only
  # changes. It requires an installed package (lockfile + src/); until those
  # exist at the repo root it stays dormant on documentation PRs.
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24.5.0'
        cache: 'npm'
        cache-dependency-path: stdLibSchema/package-lock.json
    
    - name: Install dependencies
      run: |
        cd stdLibSchema
        npm ci --legacy-peer-deps
    
    - name: Run ESLint
      run: |
        cd stdLibSchema
        npm run lint
    
    - name: Check code formatting
      run: |
        cd stdLibSchema
        npm run format:check
    
    - name: TypeScript strict check
      run: |
        cd stdLibSchema
        npx tsc --noEmit --strict

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24.5.0'
        cache: 'npm'
        cache-dependency-path: stdLibSchema/package-lock.json
    
    - name: Run npm audit
      run: |
        cd stdLibSchema
        npm audit --audit-level=moderate || true
    
    - name: Check for known vulnerabilities
      run: |
        cd stdLibSchema
        npx audit-ci --moderate || echo "::warning::Found vulnerabilities"